name: Android APK
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Build Aetherwild APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Accept licenses and install platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Aetherwild-v1.0.2.apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.aetherwild.game
            adb shell am start -W -n com.aetherwild.game/.MainActivity
            sleep 12
            adb logcat -d > /tmp/aetherwild-logcat.txt
            if grep -q "FATAL EXCEPTION" /tmp/aetherwild-logcat.txt; then
              grep -A 90 -B 10 "FATAL EXCEPTION" /tmp/aetherwild-logcat.txt || true
              exit 1
            fi
            if ! adb shell pidof com.aetherwild.game >/dev/null; then
              echo "App process exited during startup. Recent logcat:"
              tail -n 250 /tmp/aetherwild-logcat.txt
              exit 1
            fi
            echo "Aetherwild stayed alive for 12 seconds after launch."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwild-v1.0.2-android-apk
          path: release/Aetherwild-v1.0.2.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Aetherwild release
          body: |
            Aetherwild mobile 3D survival prototype.
            Includes Low, Medium, and Extreme graphics presets.
            Built automatically by GitHub Actions.
          files: release/Aetherwild-v1.0.2.apk
          generate_release_notes: true
